[package]
name = "chainstaking"
version = "0.1.0"
description = "ChainStaking Phase 1 Anchor program scaffold"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chainstaking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
solana-stake-interface = { version = "1.2.1", features = ["bincode"] }
